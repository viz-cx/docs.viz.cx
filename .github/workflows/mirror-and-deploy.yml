name: Mirror viz-cpp-node docs and deploy

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mirror-and-deploy.yml'
      - 'public/CNAME'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout viz-cpp-node
        uses: actions/checkout@v4
        with:
          repository: viz-blockchain/viz-cpp-node
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build VitePress
        run: npm run build

      - name: Add CNAME
        run: echo 'docs.viz.cx' > docs/.vitepress/dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
