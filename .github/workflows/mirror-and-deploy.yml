name: Mirror viz-cpp-node docs and deploy

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mirror-and-deploy.yml'
      - 'public/CNAME'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout viz-cpp-node
        uses: actions/checkout@v6
        with:
          repository: viz-blockchain/viz-cpp-node
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Patch VitePress base for docs.viz.cx root serving
        run: |
          sed -i "s|base: '/viz-cpp-node/'|base: '/'|" docs/.vitepress/config.mts
          grep -n "base:" docs/.vitepress/config.mts

      - name: Build VitePress
        run: npm run build

      - name: Add CNAME
        run: echo 'docs.viz.cx' > dist/CNAME

      - name: Add service-worker kill-switch
        run: |
          cat > dist/service-worker.js <<'EOF'
          // Retires the legacy VuePress @vuepress/pwa service worker that still
          // serves the old cached site to returning visitors. VitePress registers
          // no SW, so this self-destructs and leaves nothing behind.
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window' });
              clients.forEach((client) => client.navigate(client.url));
            })());
          });
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
